Screens:
  scrCustomerReport:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varCurrentUser, Office365Users.MyProfile());
        Clear(colSelectedAudits)
    Children:
      - ScreenContainer_CustomerReport:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - HeaderContainer_CustomerReport:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =cNavy
                  FillPortions: =0
                  Height: =imgAmcorLogo_CustomerReport.Height + Self.PaddingTop + Self.PaddingBottom
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - imgAmcorLogo_CustomerReport:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =40
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Image: =AmcorLogo_Transparent_Icon
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Width: =40
                  - lblAppName_CustomerReport:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =cWhite
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        Font: =gFont
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        PaddingLeft: =0
                        Size: =If(Parent.Width < 320, 11, 14)
                        Text: ="Calibrate Audit"
                        Width: =134
                  - btnHome_CustomerReport:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =cWhite
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =32
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 0.75)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.Home
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Navigate(scrHome)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(255, 255, 255, 0.5)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Width: =32
            - SubHeaderContainer_CustomerReport:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 245, 1)
                  FillPortions: =0
                  Height: =24
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =44
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - lblSubHeader_CustomerReport:
                      Control: Text@0.0.51
                      Properties:
                        Align: =""
                        BorderThickness: =0
                        Fill: =RGBA(0,0,0,0)
                        FillPortions: =1
                        Font: =gFont
                        FontColor: =cText
                        Height: =28
                        Size: =20
                        Text: ="Customer Report"
                        VerticalAlign: ="Middle"
                        Weight: ="Semibold"
                        Width: =Parent.Width - 16
            - FilterContainer_CustomerReport:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =380
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - lblFilterTitle_CustomerReport:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =cText
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        Font: =gFont
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="REPORT PARAMETERS"
                        Width: =Parent.Width - 24
                  - cmbReportCreatedBy:
                      Control: ModernCombobox@1.1.0
                      Properties:
                        DefaultSelectedItems: =Blank()
                        InputTextPlaceholder: ="Filter by creator..."
                        ItemDisplayText: =ThisItem.Value
                        Items: =Distinct(Calibrate_Audit_Data, 'Created By'.DisplayName)
                        OnChange: =Clear(colSelectedAudits)
                        SelectMultiple: =false
                        Width: =Parent.Width - 24
                  - cmbReportCustomer:
                      Control: ModernCombobox@1.1.0
                      Properties:
                        DefaultSelectedItems: =Blank()
                        InputTextPlaceholder: ="Select customer..."
                        ItemDisplayText: =ThisItem.Value
                        Items: =Distinct(Calibrate_Audit_Data, Customer)
                        OnChange: =Clear(colSelectedAudits)
                        SelectMultiple: =false
                        Width: =Parent.Width - 24
                  - cmbReportLocation:
                      Control: ModernCombobox@1.1.0
                      Properties:
                        DefaultSelectedItems: =Blank()
                        InputTextPlaceholder: ="Filter by location..."
                        ItemDisplayText: =ThisItem.Value
                        Items: |-
                          =If(
                              !IsBlank(cmbReportCustomer.Selected.Value),
                              Distinct(
                                  Filter(Calibrate_Audit_Data, Customer = cmbReportCustomer.Selected.Value),
                                  Location
                              ),
                              Distinct(Calibrate_Audit_Data, Location)
                          )
                        SelectMultiple: =false
                        Width: =Parent.Width - 24
                  - cmbReportAuditType:
                      Control: ModernCombobox@1.1.0
                      Properties:
                        DefaultSelectedItems: =Blank()
                        InputTextPlaceholder: ="Filter by audit type..."
                        ItemDisplayText: =ThisItem.Value
                        Items: |-
                          =If(
                              !IsBlank(cmbReportCustomer.Selected.Value),
                              Distinct(
                                  Filter(Calibrate_Audit_Data, Customer = cmbReportCustomer.Selected.Value),
                                  Audit_Type
                              ),
                              Distinct(Calibrate_Audit_Data, Audit_Type)
                          )
                        SelectMultiple: =false
                        Width: =Parent.Width - 24
                  - lblDateFrom_CustomerReport:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =cText2
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        Font: =gFont
                        Height: =20
                        Size: =12
                        Text: ="Date From"
                        Width: =Parent.Width - 24
                  - dpReportFrom:
                      Control: DatePicker@0.0.46
                      Properties:
                        Height: =25
                        SelectedDate: =Date(2025, 1, 1)
                        Width: =Parent.Width - 24
                  - lblDateTo_CustomerReport:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =cText2
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        Font: =gFont
                        Height: =20
                        Size: =12
                        Text: ="Date To"
                        Width: =Parent.Width - 24
                  - dpReportTo:
                      Control: DatePicker@0.0.46
                      Properties:
                        Height: =25
                        SelectedDate: =Today()
                        Width: =Parent.Width - 24
                  - btnClearFilters_CustomerReport:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Color: =cWhite
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =cSand
                        Font: =gFont
                        Height: =36
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =cWhite
                        HoverFill: =RGBA(140,133,126,1)
                        OnSelect: |-
                          =Reset(cmbReportCreatedBy);
                          Reset(cmbReportCustomer);
                          Reset(cmbReportLocation);
                          Reset(cmbReportAuditType);
                          Reset(dpReportFrom);
                          Reset(dpReportTo);
                          Clear(colSelectedAudits)
                        PressedBorderColor: =cSand
                        PressedColor: =cWhite
                        PressedFill: =RGBA(120,114,108,1)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =14
                        Text: ="Clear Filters"
                        Width: =Parent.Width - 24
            - ResultBarContainer_CustomerReport:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =24
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                Children:
                  - lblResultCount_CustomerReport:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =cText2
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        Font: =gFont
                        Height: =20
                        PaddingLeft: =4
                        Size: =12
                        Text: =Text(CountRows(galAudits_CustomerReport.AllItems)) & " audit(s) found  ·  " & Text(CountRows(colSelectedAudits)) & " selected"
                        Width: =Parent.Width - 100
                  - btnSelectAll_CustomerReport:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Color: =cNavy
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =gFont
                        Height: =28
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =cBlue
                        HoverFill: =RGBA(0, 0, 0, 0)
                        OnSelect: |-
                          =Clear(colSelectedAudits);
                          ForAll(
                              galAudits_CustomerReport.AllItems,
                              Collect(colSelectedAudits, {ID: ThisRecord.ID, Title: ThisRecord.Title})
                          )
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Size: =12
                        Text: ="Select All"
                        Width: =90
            - galAudits_CustomerReport:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Items: |-
                    =Sort(
                        Filter(
                            Calibrate_Audit_Data,
                            (IsBlank(cmbReportCustomer.Selected.Value) || Customer = cmbReportCustomer.Selected.Value) &&
                            (IsBlank(cmbReportCreatedBy.Selected.Value) || 'Created By'.DisplayName = cmbReportCreatedBy.Selected.Value) &&
                            (IsBlank(cmbReportLocation.Selected.Value) || Location = cmbReportLocation.Selected.Value) &&
                            (IsBlank(cmbReportAuditType.Selected.Value) || Audit_Type = cmbReportAuditType.Selected.Value) &&
                            Audit_Date >= dpReportFrom.SelectedDate &&
                            Audit_Date <= dpReportTo.SelectedDate
                        ),
                        Audit_Date,
                        SortOrder.Descending
                    )
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  TemplateSize: =88
                Children:
                  - galSeparator_CustomerReport:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(237, 235, 233, 1)
                        Height: =1
                        OnSelect: =Select(Parent)
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - 1
                  - lblGal_Customer_CR:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =cNavy
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =gFont
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        OnSelect: =Select(Parent)
                        PaddingLeft: =12
                        Size: =14
                        Text: =ThisItem.Customer & "  " & ThisItem.Location
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.TemplateWidth - 48
                        X: =10
                        Y: =8
                  - lblGal_Sub_CR:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =cText2
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =gFont
                        Height: =20
                        OnSelect: =Select(Parent)
                        PaddingLeft: =12
                        Size: =12
                        Text: =Text(ThisItem.Audit_Date, "[$-en-US]mmm d, yyyy") & "  ·  " & ThisItem.'Created By'.DisplayName & "  ·  " & ThisItem.Audit_Type
                        Width: =Parent.TemplateWidth - 48
                        Wrap: =false
                        X: =10
                        Y: =lblGal_Customer_CR.Y + lblGal_Customer_CR.Height
                  - lblGal_DateRep_CR:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =cText2
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =gFont
                        Height: =28
                        OnSelect: =Select(Parent)
                        PaddingLeft: =12
                        Size: =11
                        Text: =Text(ThisItem.Total_Failures) & " failures  ·  " & Text(ThisItem.Total_Packages) & " packages"
                        Width: =Parent.TemplateWidth - 48
                        X: =10
                        Y: =lblGal_Sub_CR.Y + lblGal_Sub_CR.Height
                  - chkAudit_CustomerReport:
                      Control: Classic/CheckBox@2.1.0
                      Properties:
                        BorderColor: =cNavy
                        CheckmarkFill: =cNavy
                        Default: =!IsEmpty(Filter(colSelectedAudits, ID = ThisItem.ID))
                        Height: =32
                        OnSelect: |-
                          =If(
                              IsEmpty(Filter(colSelectedAudits, ID = ThisItem.ID)),
                              Collect(colSelectedAudits, {ID: ThisItem.ID, Title: ThisItem.Title}),
                              RemoveIf(colSelectedAudits, ID = ThisItem.ID)
                          )
                        Width: =38
                        X: =Parent.TemplateWidth - 46
                        Y: =Parent.TemplateHeight / 2 - 16
            - FooterContainer_CustomerReport:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 245, 245, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =44
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - btnBack_CustomerReport:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Color: =cWhite
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =cSand
                        Font: =gFont
                        Height: =44
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =cWhite
                        HoverFill: =RGBA(140,133,126,1)
                        OnSelect: =Navigate(scrHome)
                        PressedBorderColor: =cSand
                        PressedColor: =cWhite
                        PressedFill: =RGBA(120,114,108,1)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =14
                        Text: ="Back"
                        Width: =(Parent.Width - 24) / 2
                  - btnGenerateReport_CustomerReport:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Color: =cWhite
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        DisplayMode: =If(IsEmpty(colSelectedAudits), DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =cGreen
                        Font: =gFont
                        Height: =44
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =cWhite
                        HoverFill: =RGBA(0,128,64,1)
                        OnSelect: |-
                          =Calibrate_Audit_Customer_Report.Run(
                                                        If(IsBlank(cmbReportCustomer.Selected.Value), "All", cmbReportCustomer.Selected.Value),
                                                        If(IsBlank(cmbReportLocation.Selected.Value), "All", cmbReportLocation.Selected.Value),
                                                        Text(dpReportFrom.SelectedDate, "yyyy-MM-dd"),
                                                        Text(dpReportTo.SelectedDate, "yyyy-MM-dd"),
                                                        varCurrentUser.Mail,
                                                        Concat(colSelectedAudits, Title, ",")
                                                    );
                                                    Clear(colSelectedAudits);
                                                    Notify("Your report has been sent to " & varCurrentUser.Mail, NotificationType.Success)
                        PressedBorderColor: =cGreen
                        PressedColor: =cWhite
                        PressedFill: =RGBA(0,110,54,1)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =14
                        Text: ="Generate Report"
                        Width: =(Parent.Width - 24) / 2
