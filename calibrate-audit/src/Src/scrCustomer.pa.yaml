                          =If(
                              varEditMode,
                              Navigate(scrDetail),
                              ResetForm(frmCustomerInfo);
                              Set(varSelectedCustomer, Blank());
                              Set(varCustomerSearchVisible, false);
                              Set(varCustomerSearchText, "");
                              Set(varSelectedLocation, Blank());
                              Set(varLocationSearchVisible, false);
                              Set(varLocationSearchText, "");
