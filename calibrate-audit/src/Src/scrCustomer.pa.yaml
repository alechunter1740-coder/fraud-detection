Screens:
  scrCustomer:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =If(
            varEditMode,
            Set(varCustomerSearchVisible, false);
            Set(varLocationSearchVisible, false);
            Set(varCustomerSearchText, "");
            Set(varLocationSearchText, "");
            Set(varSelectedCustomer,
                If(
                    IsBlank(LookUp(Customers, customer_name = varSelectedAudit.Customer)),
                    {customer_name: "-- Other --", customer_nbr: "", customer_location: ""},
                    LookUp(Customers, customer_name = varSelectedAudit.Customer)
                )
            );
            Set(varSelectedLocation,
                If(
                    CountRows(
                        Filter(
                            Distinct(
                                Filter(colAuditData, !IsBlank(Location) && Location <> ""),
                                Location
                            ),
                            Value = varSelectedAudit.Location
                        )
                    ) = 0,
                    {Value: "-- Other --"},
                    {Value: varSelectedAudit.Location}
                )
            )
        )
    Children:
      - ScreenContainer_Customer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - HeaderContainer_Customer:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =cNavy
                  FillPortions: =0
                  Height: =imgAmcorLogo_Customer.Height + Self.PaddingTop + Self.PaddingBottom
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - imgAmcorLogo_Customer:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =40
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Image: =AmcorLogo_Transparent_Icon
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Width: =40
                  - lblAppName_Customer:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =cWhite
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        Font: =gFont
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        PaddingLeft: =0
                        Size: =If(Parent.Width < 320, 11, 14)
                        Text: ="Calibrate Audit"
                        Width: =134
                  - btnSaveIcon_Customer:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =If(Connection.Connected, cWhite, RGBA(255, 200, 80, 1))
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(255, 255, 255, 0.3)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =32
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 0.75)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.Save
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Set(varCustomerRecord, {
                              Title:                   varAuditKey,
                              Audit_Date:              dteAudit.SelectedDate,
                              Customer:                If(varSelectedCustomer.customer_name = "-- Other --", txtCustomerOther.Text, varSelectedCustomer.customer_name),
                              Customer_Nbr:            If(varSelectedCustomer.customer_name = "-- Other --", "", varSelectedCustomer.customer_nbr),
                              Location:                If(varSelectedLocation.Value = "-- Other --", txtLocationOther.Text, varSelectedLocation.Value),
                              Audit_Type:              If(cmbAuditType.Selected.Value = "-- Other --", txtAuditTypeOther.Text, cmbAuditType.Selected.Value),
                              Audit_Type_Detail:       txtAuditTypeDetail.Text,
                              AuditDesc:               txtAuditDesc.Text,
                              Machine_Line_Number:     If(varPriorRecordsExist, If(varSelectedLineNumber.Value = "-- Other --", txtMachineLineNum.Text, varSelectedLineNumber.Value), txtMachineLineNum.Text),
                              Machine_Serial_Number:   If(varPriorRecordsExist, If(varSelectedSerialNumber.Value = "-- Other --", txtSerialNum.Text, varSelectedSerialNumber.Value), txtSerialNum.Text),
                              Lot_Batch_Number:        If(varPriorRecordsExist, If(varSelectedLotBatch.Value = "-- Other --", txtBatchLot.Text, varSelectedLotBatch.Value), txtBatchLot.Text),
                              Box_Carton_Number:       If(varPriorRecordsExist, If(varSelectedBoxCarton.Value = "-- Other --", txtCarton.Text, varSelectedBoxCarton.Value), txtCarton.Text),
                              Roll_Number:             If(varPriorRecordsExist, If(varSelectedRollNumber.Value = "-- Other --", txtRoll.Text, varSelectedRollNumber.Value), txtRoll.Text),
                              Protein:                 If(cmbProtein.Selected.Value = "-- Other --", txtProteinOther.Text, cmbProtein.Selected.Value),
                              Vendor:                  If(cmbVendor.Selected.Value = "-- Other --", txtVendorOther.Text, cmbVendor.Selected.Value),
                              Cut:                     If(cmbCut.Selected.Value = "-- Other --", txtCutOther.Text, cmbCut.Selected.Value),
                              Bag:                     If(cmbBag.Selected.Value = "-- Other --", txtBagOther.Text, cmbBag.Selected.Value),
                              Product_Type:            cmbProductType.Selected.Value,
                              Not_Listed_Product_Info: txtNotListedProductInfo.Text,
                              MS_Bag_Width:            If(IsBlank(txtBagWidth.Text) || txtBagWidth.Text = "", 0, Value(txtBagWidth.Text)),
                              MS_Bag_Length:           If(IsBlank(txtBagLength.Text) || txtBagLength.Text = "", 0, Value(txtBagLength.Text))
                          });
                          If(
                              Connection.Connected,
                              With({_byId: LookUp(Calibrate_Audit_Data, ID = varAuditSPID)},
                                  With({_row: If(!IsBlank(_byId), _byId, LookUp(Calibrate_Audit_Data, Title = varAuditKey))},
                                      Set(varAuditSPID,
                                          Patch(Calibrate_Audit_Data, If(IsBlank(_row), Defaults(Calibrate_Audit_Data), _row), varCustomerRecord).ID
                                      )
                                  )
                              );
                              Set(varSavedCustomer, varCustomerRecord.Customer);
                              Set(varSavedDate, varCustomerRecord.Audit_Date);
                              Notify("Saved to list.", NotificationType.Success),
                              ClearCollect(colCustomerRecordCache, varCustomerRecord);
                              SaveData(colCustomerRecordCache, "CustomerRecordCache");
                              Set(varSavedCustomer, varCustomerRecord.Customer);
                              Set(varSavedDate, varCustomerRecord.Audit_Date);
                              Notify("No connection — saved locally. Will sync when back online.", NotificationType.Warning)
                          )
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(255, 255, 255, 0.5)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Tooltip: =If(Connection.Connected, "Save to list", "Save offline")
                        Width: =32
                  - rectBtnDivider_Customer:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =44
                        HoverFill: =RGBA(0, 0, 0, 0)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Width: =16
                        X: =40
                        Y: =40
                  - btnHome_Customer:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =cWhite
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =32
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 0.75)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.Home
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Navigate(scrHome)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(255, 255, 255, 0.5)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Width: =32
            - SubHeaderContainer_Customer:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 245, 1)
                  FillPortions: =0
                  Height: =24
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =44
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - lblSubHeader_Customer:
                      Control: Text@0.0.51
                      Properties:
                        Align: =""
                        BorderThickness: =0
                        Fill: =RGBA(0,0,0,0)
                        FillPortions: =1
                        Font: =gFont
                        FontColor: =cText
                        Height: =28
                        Size: =20
                        Text: ="Customer & Machine Details"
                        VerticalAlign: ="Middle"
                        Weight: ="Semibold"
                        Width: =Parent.Width - 16
            - MainContainer_Customer:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - frmCustomerInfo:
                      Control: Form@2.4.4
                      Layout: Vertical
                      Properties:
                        BorderColor: =RGBA(245, 245, 245, 1)
                        DataSource: =Calibrate_Audit_Data
                        DefaultMode: =If(varEditMode, FormMode.Edit, FormMode.New)
                        Item: =If(varEditMode, varSelectedAudit, Blank())
                        LayoutMinHeight: =16
                        LayoutMinWidth: =Parent.Width
                      Children:
                        - crdCustomerInfoHeader:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              DataField: ="Title"
                              Default: =ThisItem.Title
                              DisplayName: =DataSourceInfo([@Calibrate_Audit_Data],DataSourceInfo.DisplayName,Title)
                              Height: =41
                              MaxLength: =DataSourceInfo([@Calibrate_Audit_Data], DataSourceInfo.MaxLength, Title)
                              Required: =false
                              Update: =""
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                            Children:
                              - rectCustInfoHeaderBg:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =RGBA(250, 250, 250, 1)
                                    Height: =40
                                    Width: =Parent.Width
                              - rectCustInfoHeaderBorder:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =RGBA(0, 57, 90, 1)
                                    Height: =2
                                    Width: =Parent.Width
                                    Y: =39
                              - lblCustInfoHeaderText:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =RGBA(0, 57, 90, 1)
                                    Font: =gFont
                                    FontWeight: =FontWeight.Bold
                                    Height: =39
                                    PaddingLeft: =16
                                    Size: =14
                                    Text: ="CUSTOMER INFORMATION"
                                    Width: =Parent.Width
                        - crdCustomer:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              DataField: ="Customer"
                              Default: =ThisItem.Customer
                              DisplayName: =DataSourceInfo([@Calibrate_Audit_Data],DataSourceInfo.DisplayName,Customer)
                              MaxLength: =DataSourceInfo([@Calibrate_Audit_Data], DataSourceInfo.MaxLength, Customer)
                              Required: =false
                              Update: =If(varSelectedCustomer.customer_name = "-- Other --", txtCustomerOther.Text, varSelectedCustomer.customer_name)
                              Width: =If(Parent.Width > 600, (Parent.Width / 2) - 16, Parent.Width)
                              WidthFit: =true
                              X: =0
                              Y: =1
                            Children:
                              - lblCustomer:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =23
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =16
                                    Text: =Parent.DisplayName
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width - 48
                                    Wrap: =false
                                    X: =24
                                    Y: =10
                              - cmbCustomer:
                                  Control: ModernCombobox@1.1.0
                                  Properties:
                                    DefaultSelectedItems: |-
                                      =If(
                                          !IsBlank(varSelectedCustomer.customer_name),
                                          Table({Value: varSelectedCustomer.customer_name}),
                                          Blank()
                                      )
                                    InputTextPlaceholder: ="Type to search customers..."
                                    IsSearchable: =true
                                    ItemDisplayText: =ThisItem.Value
                                    Items: |-
                                      =If(
                                          Len(Self.SearchText) >= 2,
                                          Table(
                                              {Value: "-- Other --"},
                                              Distinct(Filter(colCustomers, customer_name <> "-- Other --" && StartsWith(customer_name, Self.SearchText)), customer_name)
                                          ),
                                          Table({Value: "-- Other --"})
                                      )
                                    OnChange: |-
                                      =Set(varSelectedCustomer,
                                          If(Self.Selected.Value = "-- Other --",
                                              {customer_name: "-- Other --", customer_nbr: "", customer_location: ""},
                                              {customer_name: Self.Selected.Value, customer_nbr: LookUp(colCustomers, customer_name = Self.Selected.Value).customer_nbr, customer_location: ""}
                                          )
                                      );
                                      Set(varSelectedLocation, Blank());
                                      Set(varPriorRecordsExist, false);
                                      Set(varSelectedLineNumber, Blank());
                                      Set(varSelectedSerialNumber, Blank());
                                      Set(varSelectedLotBatch, Blank());
                                      Set(varSelectedBoxCarton, Blank());
                                      Set(varSelectedRollNumber, Blank())
                                    SelectMultiple: =false
                                    Size: =18
                                    Width: =Parent.Width - 32
                                    X: =24
                                    Y: =lblCustomer.Y + lblCustomer.Height + 4
                              - txtCustomerOther:
                                  Control: ModernTextInput@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Other Customer"
                                    Default: =If(varEditMode && !IsBlank(varSelectedAudit.Customer) && IsBlank(LookUp(Customers, customer_name = varSelectedAudit.Customer)), varSelectedAudit.Customer, "")
                                    DisplayMode: =Parent.DisplayMode
                                    FontWeight: =""
                                    MaxLength: =-1
                                    Placeholder: ="Enter customer name..."
                                    Size: =0
                                    TriggerOutput: =TriggerOutput.FocusOut
                                    ValidationState: ="None"
                                    Visible: =varSelectedCustomer.customer_name = "-- Other --"
                                    Width: =Parent.Width - 32
                                    X: =24
                                    Y: =cmbCustomer.Y + cmbCustomer.Height + 4
                        - crdLocation:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              DataField: ="Location"
                              Default: =ThisItem.Location
                              DisplayName: =DataSourceInfo([@Calibrate_Audit_Data],DataSourceInfo.DisplayName,Location)
                              MaxLength: =DataSourceInfo([@Calibrate_Audit_Data], DataSourceInfo.MaxLength, Location)
                              Required: =false
                              Update: =If(varSelectedLocation.Value = "-- Other --", txtLocationOther.Text, If(!IsBlank(varSelectedLocation.Value), varSelectedLocation.Value, ""))
                              Width: =If(Parent.Width > 600, (Parent.Width / 2) - 16, Parent.Width)
                              WidthFit: =true
                              X: =1
                              Y: =1
                            Children:
                              - lblLocation:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =23
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =16
                                    Text: =Parent.DisplayName
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width - 48
                                    Wrap: =false
                                    X: =24
                                    Y: =10
                              - cmbLocation:
                                  Control: ModernCombobox@1.1.0
                                  Properties:
                                    DefaultSelectedItems: |-
                                      =If(
                                          !IsBlank(varSelectedLocation.Value),
                                          Table({Value: varSelectedLocation.Value}),
                                          Blank()
                                      )
                                    InputTextPlaceholder: ="Select or type a location..."
                                    IsSearchable: =true
                                    ItemDisplayText: =ThisItem.Value
                                    Items: |-
                                      =Table(
                                          Distinct(
                                              Filter(colCustomers,
                                                  customer_name = If(varSelectedCustomer.customer_name = "-- Other --", "", varSelectedCustomer.customer_name) &&
                                                  !IsBlank(customer_location) && customer_location <> ""
                                              ),
                                              customer_location
                                          ),
                                          {Value: "-- Other --"}
                                      )
                                    OnChange: |-
                                      =Set(varSelectedLocation, Self.Selected);
                                      Set(varPriorRecordsExist,
                                          CountRows(
                                              Filter(colAuditData,
                                                  Customer = If(varSelectedCustomer.customer_name = "-- Other --", txtCustomerOther.Text, varSelectedCustomer.customer_name) &&
                                                  Location = If(Self.Selected.Value = "-- Other --", txtLocationOther.Text, Self.Selected.Value)
                                              )
                                          ) > 0
                                      );
                                      Set(varSelectedLineNumber, Blank());
                                      Set(varSelectedSerialNumber, Blank());
                                      Set(varSelectedLotBatch, Blank());
                                      Set(varSelectedBoxCarton, Blank());
                                      Set(varSelectedRollNumber, Blank())
                                    SelectMultiple: =false
                                    Size: =18
                                    Width: =Parent.Width - 32
                                    X: =24
                                    Y: =lblLocation.Y + lblLocation.Height + 4
                              - txtLocationOther:
                                  Control: ModernTextInput@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Other Location"
                                    Default: |-
                                      =If(
                                          varEditMode,
                                          varSelectedAudit.Location,
                                          ""
                                      )
                                    DisplayMode: =Parent.DisplayMode
                                    FontWeight: =""
                                    MaxLength: =-1
                                    Placeholder: ="Enter location..."
                                    Size: =0
                                    TriggerOutput: =TriggerOutput.FocusOut
                                    ValidationState: ="None"
                                    Visible: =varSelectedLocation.Value = "-- Other --"
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =cmbLocation.Y + cmbLocation.Height + 4
                        - crdAuditDate:
                            Control: TypedDataCard@1.0.7
                            Variant: DateEdit
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              DataField: ="Audit_Date"
                              Default: =ThisItem.Audit_Date
                              DisplayName: =DataSourceInfo([@Calibrate_Audit_Data],DataSourceInfo.DisplayName,Audit_Date)
                              Required: =false
                              Update: =dteAudit.SelectedDate
                              Width: =If(Parent.Width > 600, (Parent.Width / 2) - 16, Parent.Width)
                              WidthFit: =true
                              X: =0
                              Y: =2
                            Children:
                              - lblAuditDate:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =23
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =16
                                    Text: ="Audit Date"
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width - 48
                                    Wrap: =false
                                    X: =24
                                    Y: =10
                              - dteAudit:
                                  Control: Classic/DatePicker@2.6.0
                                  Properties:
                                    BorderColor: =RGBA(229, 229, 229, 1)
                                    BorderThickness: =1
                                    Color: =cText
                                    DefaultDate: |-
                                      =If(
                                          varEditMode,
                                          Parent.Default,
                                          Today()
                                      )
                                    DisplayMode: =Parent.DisplayMode
                                    Fill: =RGBA(248, 248, 248, 1)
                                    Font: =gFont
                                    Height: =38
                                    IconBackground: =cNavy
                                    IconFill: =cWhite
                                    InputTextPlaceholder: ="Select a date..."
                                    Width: =cmbCustomer.Width
                                    X: =24
                                    Y: =lblAuditDate.Y + lblAuditDate.Height + 4
                        - crdAuditType:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              DataField: ="Audit_Type"
                              Default: =ThisItem.Audit_Type
                              DisplayName: =DataSourceInfo([@Calibrate_Audit_Data],DataSourceInfo.DisplayName,Audit_Type)
                              MaxLength: =DataSourceInfo([@Calibrate_Audit_Data], DataSourceInfo.MaxLength, Audit_Type)
                              Required: =false
                              Update: =If(cmbAuditType.Selected.Value = "-- Other --", txtAuditTypeOther.Text, cmbAuditType.Selected.Value)
                              Width: =If(Parent.Width > 600, (Parent.Width / 2) - 16, Parent.Width)
                              WidthFit: =true
                              X: =1
                              Y: =2
                            Children:
                              - lblAuditType:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =23
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =16
                                    Text: ="Audit Type"
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width - 48
                                    Wrap: =false
                                    X: =24
                                    Y: =10
                              - cmbAuditType:
                                  Control: ModernCombobox@1.1.0
                                  Properties:
                                    DefaultSelectedItems: |-
                                      =If(
                                          varEditMode,
                                          Filter(["Pack Station / In-Line","24 Hr Hold","Extended Hold","Transportation","Rework","-- Other --"], Value = varSelectedAudit.Audit_Type),
                                          Blank()
                                      )
                                    InputTextPlaceholder: ="Select audit type..."
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =["Pack Station / In-Line","24 Hr Hold","Extended Hold","Transportation","Rework","-- Other --"]
                                    SelectMultiple: =false
                                    Size: =18
                                    Width: =Parent.Width - 32
                                    X: =24
                                    Y: =lblAuditType.Y + lblAuditType.Height + 4
                              - txtAuditTypeOther:
                                  Control: ModernTextInput@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Other Audit Type"
                                    DisplayMode: =Parent.DisplayMode
                                    FontWeight: =""
                                    MaxLength: =-1
                                    Placeholder: ="Describe audit type..."
                                    Size: =0
                                    TriggerOutput: =TriggerOutput.FocusOut
                                    ValidationState: ="None"
                                    Visible: =cmbAuditType.Selected.Value = "-- Other --"
                                    Width: =Parent.Width - 32
                                    X: =24
                                    Y: =cmbAuditType.Y + cmbAuditType.Height + 4
                        - crdAuditTypeDetail:
                            Control: TypedDataCard@1.0.7
                            Variant: TextualEdit
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              DataField: ="Audit_Type_Detail"
                              Default: =ThisItem.Audit_Type_Detail
                              DisplayName: =DataSourceInfo([@Calibrate_Audit_Data],DataSourceInfo.DisplayName,Audit_Type_Detail)
                              MaxLength: =DataSourceInfo([@Calibrate_Audit_Data], DataSourceInfo.MaxLength, Audit_Type_Detail)
                              Required: =false
                              Update: =txtAuditTypeDetail.Text
                              Visible: =cmbAuditType.Selected.Value = "Extended Hold" || cmbAuditType.Selected.Value = "Transportation"
                              Width: =Parent.Width
                              X: =0
                              Y: =3
                            Children:
                              - lblAuditTypeDetail:
                                  Control: Text@0.0.51
                                  Properties:
                                    Height: =22
