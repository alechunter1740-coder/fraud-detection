                        Align: =""
                        BorderThickness: =0
                        Fill: =RGBA(0,0,0,0)
                        FillPortions: =1
                        Font: =gFont
                        FontColor: =cText
                        Height: =28
                        Size: =20
                        Text: =varSelectedAudit.Title
                        VerticalAlign: ="Middle"
                        Weight: ="Semibold"
                        Width: =Parent.Width - 16
