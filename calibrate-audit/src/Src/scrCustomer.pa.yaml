                        Fill: =cWhite
                        Font: =gFont
                        Height: =44
                        HoverBorderColor: =cNavy
                        HoverColor: =cWhite
                        HoverFill: =cNavy
                        OnSelect: |-
                          =Refresh(Calibrate_Audit_Data);
                          ClearCollect(colAuditData, Calibrate_Audit_Data);
                          ClearCollect(colCustomers, Sort(Customers, customer_name, SortOrder.Ascending));
                          Collect(colCustomers, {customer_name: "-- Other --", customer_nbr: "", customer_location: ""});
                          Refresh(Audit_Bag_List);
                          Notify("Data refreshed.", NotificationType.Success)
