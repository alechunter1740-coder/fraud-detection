Screens:
  scrLookup:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - ScreenContainer_Lookup:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - HeaderContainer_Lookup:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =cNavy
                  FillPortions: =0
                  Height: =imgAmcorLogo_Lookup.Height + Self.PaddingTop + Self.PaddingBottom
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - imgAmcorLogo_Lookup:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =40
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Image: =AmcorLogo_Transparent_Icon
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Width: =40
                  - lblAppName_Lookup:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =cWhite
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        Font: =gFont
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        PaddingLeft: =0
                        Size: =If(Parent.Width < 320, 11, 14)
                        Text: ="Calibrate Audit"
                        Width: =134
                  - btnHome_Lookup:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =cWhite
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =32
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 0.75)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.Home
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Navigate(scrHome)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(255, 255, 255, 0.5)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Width: =32
            - SubHeaderContainer_Lookup:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 245, 1)
                  FillPortions: =0
                  Height: =27
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =44
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - lblSubHeader_Lookup:
                      Control: Text@0.0.51
                      Properties:
                        Align: =""
                        BorderThickness: =0
                        Fill: =RGBA(0,0,0,0)
                        FillPortions: =1
                        Font: =gFont
                        FontColor: =cText
                        Height: =28
                        Size: =20
                        Text: ="Audit Lookup"
                        VerticalAlign: ="Middle"
                        Weight: ="Semibold"
                        Width: =Parent.Width - 16
            - FilterContainer_Lookup:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =300
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - lblFilters:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =cText
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        Font: =gFont
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="FILTERS"
                        Width: =Parent.Width - 24
                  - cmbFilterRep:
                      Control: ModernCombobox@1.1.0
                      Properties:
                        DefaultSelectedItems: =Blank()
                        InputTextPlaceholder: ="Filter by rep (created by)..."
                        ItemDisplayText: =ThisItem.Value
                        Items: |-
                          =Sort(
                              Distinct(
                                  Filter(Calibrate_Audit_Data, !IsBlank(Customer) && Customer <> ""),
                                  'Created By'.DisplayName
                              ),
                              Value,
                              SortOrder.Ascending
                          )
                        SelectMultiple: =false
                        Width: =Parent.Width - 24
                  - cmbFilterCustomer:
                      Control: ModernCombobox@1.1.0
                      Properties:
                        DefaultSelectedItems: =Blank()
                        InputTextPlaceholder: ="Filter by customer..."
                        ItemDisplayText: =ThisItem.Value
                        Items: |-
                          =Sort(
                              Distinct(
                                  Filter(
                                      Calibrate_Audit_Data,
                                      !IsBlank(Customer) && Customer <> "",
                                      IsBlank(cmbFilterRep.Selected) || 'Created By'.DisplayName = cmbFilterRep.Selected.Value
                                  ),
                                  Customer
                              ),
                              Value,
                              SortOrder.Ascending
                          )
                        SelectMultiple: =false
                        Width: =Parent.Width - 24
                  - lblDateFrom:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =cText2
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        Font: =gFont
                        Height: =20
                        Size: =12
                        Text: ="Date From"
                        Width: =Parent.Width - 24
                  - dpFrom:
                      Control: DatePicker@0.0.46
                      Properties:
                        SelectedDate: =Date(2024, 1, 1)
                        Width: =Parent.Width - 24
                  - lblDateTo:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =cText2
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        Font: =gFont
                        Height: =20
                        Size: =12
                        Text: ="Date To"
                        Width: =Parent.Width - 24
                  - dpTo:
                      Control: DatePicker@0.0.46
                      Properties:
                        SelectedDate: =Today()
                        Width: =Parent.Width - 24
                  - btnClearFilters:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Color: =cWhite
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =cSand
                        Font: =gFont
                        Height: =36
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =cWhite
                        HoverFill: =RGBA(140,133,126,1)
                        OnSelect: |-
                          =Reset(cmbFilterRep);
                          Reset(cmbFilterCustomer);
                          Reset(dpFrom);
                          Reset(dpTo)
                        PressedBorderColor: =cSand
                        PressedColor: =cWhite
                        PressedFill: =RGBA(120,114,108,1)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =14
                        Text: ="Clear Filters"
                        Width: =Parent.Width - 24
            - lblResultCount:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  Color: =cText2
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  Font: =gFont
                  Height: =20
                  PaddingLeft: =4
                  Size: =12
                  Text: =Text(CountRows(galAudits.AllItems)) & " audit(s) found"
                  Width: =Parent.Width - 32
            - galAudits:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Items: |-
                    =Sort(
                        Filter(
                            Calibrate_Audit_Data,
                            !IsBlank(Customer) && Customer <> "",
                            (IsBlank(cmbFilterRep.Selected) || 'Created By'.DisplayName = cmbFilterRep.Selected.Value),
                            (IsBlank(cmbFilterCustomer.Selected) || Customer = cmbFilterCustomer.Selected.Value),
                            Audit_Date >= dpFrom.SelectedDate,
                            Audit_Date <= dpTo.SelectedDate
                        ),
                        Audit_Date,
                        SortOrder.Descending
                    )
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  TemplateSize: =88
                Children:
                  - galSeparator:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(237, 235, 233, 1)
                        Height: =1
                        OnSelect: =Select(Parent)
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - 1
                  - lblGal_Customer:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =cNavy
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =gFont
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        OnSelect: =Select(Parent)
                        PaddingLeft: =12
                        Size: =14
                        Text: =ThisItem.Customer
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.TemplateWidth - 20
                        X: =10
                        Y: =8
                  - lblGal_Location:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =cText2
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =gFont
                        Height: =20
                        OnSelect: =Select(Parent)
                        PaddingLeft: =12
                        Size: =12
                        Text: =ThisItem.Location
                        Width: =Parent.TemplateWidth - 20
                        Wrap: =false
                        X: =10
                        Y: =lblGal_Customer.Y + lblGal_Customer.Height
                  - lblGal_DateRep:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =cText2
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =gFont
                        Height: =28
                        OnSelect: =Select(Parent)
                        PaddingLeft: =12
                        Size: =11
                        Text: =Text(ThisItem.Audit_Date, "[$-en-US]mmm d, yyyy") & "  ·  " & ThisItem.'Created By'.DisplayName & "  ·  " & Text(ThisItem.Total_Failures) & " failures"
                        Width: =Parent.TemplateWidth - 20
                        X: =10
                        Y: =lblGal_Location.Y + lblGal_Location.Height
                  - btnGal_Select:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Color: =RGBA(0, 0, 0, 0)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =88
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 120, 212, 0.05)
                        OnSelect: |-
                          =Set(varSelectedAudit, ThisItem);
                          Set(varAuditKey, ThisItem.Title);
                          Set(varEditMode, false);
                          Navigate(scrDetail)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 120, 212, 0.1)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Text: =""
                        Width: =Parent.TemplateWidth
            - FooterContainer_Lookup:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 245, 245, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =44
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - btnBack_Lookup:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =cNavy
                        BorderThickness: =1
                        Color: =cNavy
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =cWhite
                        Font: =gFont
                        Height: =44
                        HoverBorderColor: =cNavy
                        HoverColor: =cWhite
                        HoverFill: =cNavy
                        OnSelect: =Navigate(scrHome)
                        PressedBorderColor: =cNavy
                        PressedColor: =cWhite
                        PressedFill: =RGBA(0, 40, 70, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =14
                        Text: ="Back"
                        Width: =(Parent.Width - 24) / 2
                  - btnRefresh_Lookup:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =cNavy
                        BorderThickness: =1
                        Color: =cWhite
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =cNavy
                        Font: =gFont
                        Height: =44
                        HoverBorderColor: =cNavy
                        HoverColor: =cWhite
                        HoverFill: =RGBA(0, 80, 130, 1)
                        OnSelect: =Refresh(Calibrate_Audit_Data)
                        PressedBorderColor: =cNavy
                        PressedColor: =cWhite
                        PressedFill: =RGBA(0, 40, 70, 1)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Size: =14
                        Text: ="Refresh"
                        Width: =(Parent.Width - 24) / 2
